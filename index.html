<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a3202b">
  <title>Juleglede</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>🎄 Juleglede</h1>
    <nav class="tabs" role="tablist" aria-label="Faner">
      <button class="tab active" role="tab" aria-selected="true" data-tab="handel"><span class="tab-icon">🛒</span> Julehandelen</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="produksjon"><span class="tab-icon">👩‍🍳</span> Produksjon</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="gaver"><span class="tab-icon">🎁</span> Gaver</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="takk"><span class="tab-icon">💌</span> Takkeliste</button>
      <!-- Flere faner kommer her -->
    </nav>
  </header>

  <main>
    <section id="tab-handel" class="tab-panel active" role="tabpanel">
      <form id="add-form" class="card add-form" autocomplete="off">
        <label class="field field-name">
          <span>Vare</span>
          <input id="item-name" type="text" placeholder="F.eks. ribbe, kålrot, brunost …" required>
        </label>
        <label class="field field-qty">
          <span>Antall</span>
          <input id="item-qty" type="text" placeholder="2 stk">
        </label>
        <label class="field field-cat">
          <span>Kategori</span>
          <select id="item-cat"></select>
        </label>
        <label class="field field-store">
          <span>Butikk (valgfritt)</span>
          <input id="item-store" type="text" list="store-list" placeholder="F.eks. Rema, Meny …">
          <datalist id="store-list"></datalist>
        </label>
        <button type="submit" class="btn primary">Legg til</button>
      </form>

      <div class="toolbar">
        <label class="switch">
          <input id="split-store" type="checkbox">
          <span>Del på butikk</span>
        </label>
        <span id="summary" class="summary"></span>
        <button id="clear-done" class="btn ghost" type="button">Fjern avkryssede</button>
      </div>

      <div id="list"></div>
      <p id="empty" class="empty">Handlelista er tom. Legg til noe godt til jul! 🎅</p>
    </section>

    <section id="tab-produksjon" class="tab-panel" role="tabpanel">
      <form id="prod-form" class="card prod-form" autocomplete="off">
        <label class="field">
          <span>Hva skal lages?</span>
          <input id="prod-name" type="text" placeholder="F.eks. pepperkaker, ribbemiddag, julekort …" required>
        </label>
        <button type="submit" class="btn primary">Legg til</button>
      </form>
      <div id="prod-list"></div>
      <p id="prod-empty" class="empty">Ingenting å lage ennå. Hva står på julelista? 🍪</p>
    </section>

    <section id="tab-gaver" class="tab-panel" role="tabpanel">
      <form id="person-form" class="card prod-form" autocomplete="off">
        <label class="field">
          <span>Hvem skal du handle til?</span>
          <input id="person-name" type="text" placeholder="F.eks. mamma, Ola, svigerfar …" required>
        </label>
        <button type="submit" class="btn primary">Legg til</button>
      </form>
      <p id="gift-summary" class="summary gift-summary"></p>
      <div id="person-list"></div>
      <p id="person-empty" class="empty">Ingen på gavelista ennå. Hvem skal få noe under treet? 🎁</p>
    </section>

    <section id="tab-takk" class="tab-panel" role="tabpanel">
      <form id="takk-form" class="card takk-form" autocomplete="off">
        <label class="field">
          <span>Fra hvem?</span>
          <input id="takk-from" type="text" list="takk-from-list" placeholder="F.eks. tante Kari" required>
          <datalist id="takk-from-list"></datalist>
        </label>
        <label class="field">
          <span>Hva fikk du?</span>
          <input id="takk-what" type="text" placeholder="F.eks. rødt skjerf" required>
        </label>
        <label class="field">
          <span>Til hvem (valgfritt)</span>
          <input id="takk-to" type="text" list="takk-to-list" placeholder="F.eks. Emma">
          <datalist id="takk-to-list"></datalist>
        </label>
        <button type="submit" class="btn primary">Legg til</button>
      </form>

      <div class="toolbar">
        <label class="switch">
          <input id="takk-hide" type="checkbox">
          <span>Skjul ferdig takket</span>
        </label>
        <span id="takk-summary" class="summary"></span>
      </div>

      <div id="takk-list"></div>
      <p id="takk-empty" class="empty">Ingen gaver registrert ennå. God jul! 🎄</p>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/produksjon.js"></script>
  <script src="js/gaver.js"></script>
  <script src="js/takk.js"></script>
</body>
</html>
